---
include:
  - ../components/caddy_network.yaml

#networks:

volumes:
  caddy-data:
    external: true
  caddy-config:
    external: true

#secrets:

services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare@sha256:17505a5e55432764957953787b065f400a1f1a0c280c3b4da2c99ce4746708d6
    pull_policy: ${pull_policy}
    container_name: ${caddy_container_name}
    restart: ${restart}
    networks:
      - caddy
    ports:
      - "${caddy_port_80}:80"
      - "${caddy_port_443}:443"
      - "${caddy_port_443}:443/udp"
    environment:    
      - TZ=${timezone}
      - CADDY_PRIVATE_DOMAIN=${CADDY_PRIVATE_DOMAIN}
      - CADDY_PUBLIC_DOMAIN=${CADDY_PUBLIC_DOMAIN}
      - CLOUDFLARE_API_TOKEN=${CADDY_CLOUDFLARE_API}    
    volumes:
      - $PWD/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

